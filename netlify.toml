[functions]
  node_bundler = "esbuild"
  included_files = ["import-data.csv"]

[functions."payroll-scheduled"]
  schedule = "0 0 * * 6"  # Every Saturday at midnight (UTC)

# Date-driven automation rules (pre-event reminders, post-event follow-ups).
# 14:00 UTC = 9am Central, so a reminder lands in the morning rather than
# overnight. Before this existed the rules only fired when someone clicked
# "run scheduled" in the admin UI.
[functions."automations-scheduled"]
  schedule = "0 14 * * *"  # Every day at 14:00 UTC (9am Central)

# Calendar feed. Two paths to one function: the .ics form is what a calendar
# client subscribes to, the bare form is the admin call that returns the URL.
[[redirects]]
  from = "/api/calendar.ics"
  to = "/.netlify/functions/calendar"
  status = 200

[[redirects]]
  from = "/api/calendar"
  to = "/.netlify/functions/calendar"
  status = 200

# Twilio webhooks. The signature check rebuilds the signed URL from SITE_URL +
# these exact paths, so Twilio must be configured with these URLs and no query
# string — see _twilio-sig.js.
[[redirects]]
  from = "/api/sms-status"
  to = "/.netlify/functions/sms-status"
  status = 200

[[redirects]]
  from = "/api/sms-webhook"
  to = "/.netlify/functions/sms-webhook"
  status = 200
